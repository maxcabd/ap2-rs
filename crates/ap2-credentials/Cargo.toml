[package]
name = "ap2-credentials"
description = "AP2 credential mechanics: JWT/JWS parsing, SD-JWT selective disclosure, and signature verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ap2-core = { path = "../ap2-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# ADR 0001: JWT/JWS via jsonwebtoken (rust_crypto backend -- pure Rust, no
# cmake/clang build dependency), SD-JWT via sd-jwt-payload.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sd-jwt-payload = "0.5"

# x5c certificate chain verification (RootKeyResolver, ap2-verify). Pure
# Rust (RustCrypto), matching the ADR 0001 rationale above.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
der = "0.8"
spki = "0.8"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }
base64 = "0.22"
