[workspace]
resolver = "2"
members = [
    "crates/ap2-core",
    "crates/ap2-credentials",
    "crates/ap2-verify",
    "crates/ap2-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/maxcabd/ap2-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
