[package]
name = "ap2-verify"
description = "Deterministic, role-aware AP2 verification built on ap2-core and ap2-credentials."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ap2-core = { path = "../ap2-core" }
ap2-credentials = { path = "../ap2-credentials" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
der = "0.8"
